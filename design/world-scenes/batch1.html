<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: the Worlds tab, three tiles with flat layered scenes (simple shapes only), name on the soft melt. SimDesk tokens. */
:root{--bg:#FAF8F7;--surface:#FFFFFF;--line:#ECE4E1;--text:#24191F;--muted:#7A6B72;--accent:#B83C76;
  --display:'Gabarito',system-ui,sans-serif;--body:'Rethink Sans','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171214;--surface:#211A1D;--line:#3A2F33;--text:#F5ECEF;--muted:#B3A2A9;--accent:#F07DB0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171214;--surface:#211A1D;--line:#3A2F33;--text:#F5ECEF;--muted:#B3A2A9;--accent:#F07DB0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.page{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:30px;font-weight:800;margin:0}
.note{color:var(--muted);margin:0;max-width:66ch}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tiles.big{grid-template-columns:1fr}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 10px rgba(36,25,31,.06);max-width:100%}
.big .tile{aspect-ratio:16/6}
.tile svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,color-mix(in srgb,var(--bg) 72%,transparent) 76%,var(--bg) 100%)}
.nm{position:absolute;left:16px;bottom:12px;z-index:1;display:flex;flex-direction:column}
.nm b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.15}
.nm span{font-size:12.5px;color:var(--muted)}
</style>
